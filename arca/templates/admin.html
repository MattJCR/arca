<section id="chat-section" role="tabpanel">
<h2 data-i18n="admin.chat.heading"></h2>
<p class="result-count" id="chat-limits"></p>
<form id="chat-settings" class="settings-form">
<label for="chat-max-chunks" data-i18n="admin.chat.max_chunks"></label>
<input id="chat-max-chunks" type="number" min="1" step="1">
<label for="chat-max-tokens" data-i18n="admin.chat.max_evidence_tokens"></label>
<input id="chat-max-tokens" type="number" min="1" step="1">
<label for="chat-max-calls" data-i18n="admin.chat.max_tool_calls"></label>
<input id="chat-max-calls" type="number" min="0" step="1">
<label for="chat-prompt" data-i18n="admin.chat.system_prompt"></label>
<textarea id="chat-prompt" rows="6"></textarea>
<p class="detail" data-i18n="admin.chat.system_prompt_hint"></p>
<label for="chat-risk-topics" data-i18n="admin.chat.risk_topics"></label>
<textarea id="chat-risk-topics" rows="3"></textarea>
<p class="detail" data-i18n="admin.chat.risk_topics_hint"></p>
<label for="chat-sampling" data-i18n="admin.chat.sampling"></label>
<textarea id="chat-sampling" rows="3"></textarea>
<p><button type="submit" data-i18n="admin.chat.save"></button></p>
</form>
<p id="chat-settings-message" class="message" hidden aria-live="polite"></p>
</section>
<section id="vendor-section" role="tabpanel">
<h2 data-i18n="admin.vendor.heading"></h2>
<p>
<button id="vendor-download-button" data-i18n="admin.vendor.download_button"></button>
<button id="vendor-verify-button" data-i18n="admin.vendor.verify_button"></button>
<button id="vendor-index-button" data-i18n="admin.vendor.index_button"></button>
</p>
<h3 data-i18n="admin.vendor.llama_heading"></h3>
<p class="detail" data-i18n="admin.vendor.llama_note"></p>
<form id="llama-commit-form">
<div class="field field-wide">
<label for="llama-commit" data-i18n="admin.vendor.llama_label"></label>
<input id="llama-commit" type="text" autocomplete="off">
</div>
<div class="field field-submit">
<button type="submit" data-i18n="admin.vendor.llama_button"></button>
</div>
</form>
<p id="vendor-message" class="message" hidden aria-live="polite"></p>
<div class="table-scroll">
<table class="data" id="vendor-table">
<thead><tr>
<th data-i18n="admin.vendor.col.key"></th>
<th data-i18n="admin.vendor.col.version"></th>
<th data-i18n="admin.vendor.col.kind"></th>
<th data-i18n="admin.vendor.col.license"></th>
<th data-i18n="admin.vendor.col.file"></th>
<th data-i18n="admin.vendor.col.state"></th>
</tr></thead>
<tbody id="vendor-body"></tbody>
</table>
</div>
<h3 data-i18n="admin.vendor.drift_heading"></h3>
<div class="table-scroll">
<table class="data" id="drift-table">
<thead><tr>
<th data-i18n="admin.vendor.drift.col.package"></th>
<th data-i18n="admin.vendor.drift.col.installed"></th>
<th data-i18n="admin.vendor.drift.col.documented"></th>
<th data-i18n="admin.vendor.drift.col.state"></th>
</tr></thead>
<tbody id="drift-body"></tbody>
</table>
</div>
</section>
<section id="search-section" role="tabpanel">
<h2 data-i18n="admin.search.heading"></h2>
<form id="search-settings" class="settings-form">
<label for="search-per-source" data-i18n="admin.search.per_source"></label>
<input id="search-per-source" type="number" min="1" step="1">
<label for="search-zim-weight" data-i18n="admin.search.zim_weight"></label>
<input id="search-zim-weight" type="number" min="1" max="5" step="1">
<label for="search-doc-weight" data-i18n="admin.search.doc_weight"></label>
<input id="search-doc-weight" type="number" min="1" max="5" step="1">
<p class="detail" data-i18n="admin.search.weights_note"></p>
<label for="search-snippet" data-i18n="admin.search.snippet_chars"></label>
<input id="search-snippet" type="number" min="80" max="1000" step="10">
<label for="search-chunk-min" data-i18n="admin.search.chunk_min_tokens"></label>
<input id="search-chunk-min" type="number" min="100" max="900" step="10">
<label for="search-chunk-max" data-i18n="admin.search.chunk_max_tokens"></label>
<input id="search-chunk-max" type="number" min="100" max="900" step="10">
<p class="detail" data-i18n="admin.search.chunk_note"></p>
<p><button type="submit" data-i18n="admin.search.save"></button></p>
</form>
<p id="search-settings-message" class="message" hidden aria-live="polite"></p>
</section>
<section id="maintenance-section" role="tabpanel">
<h2 data-i18n="admin.maintenance.heading"></h2>
<h3 data-i18n="admin.maintenance.paths_heading"></h3>
<ul id="maintenance-paths" class="status"></ul>
<h3 data-i18n="admin.maintenance.logs_heading"></h3>
<p class="detail" id="maintenance-rotation"></p>
<ul id="maintenance-logs" class="status"></ul>
<h3 data-i18n="admin.maintenance.verify_heading"></h3>
<p class="detail" data-i18n="admin.maintenance.verify_note"></p>
<p><button id="integrity-button" data-i18n="admin.maintenance.verify_button"></button></p>
<p id="integrity-message" class="message" hidden aria-live="polite"></p>
<div class="table-scroll">
<table class="data" id="integrity-table">
<thead><tr>
<th data-i18n="admin.maintenance.col.kind"></th>
<th data-i18n="admin.maintenance.col.name"></th>
<th data-i18n="admin.maintenance.col.result"></th>
<th data-i18n="admin.maintenance.col.detail"></th>
</tr></thead>
<tbody id="integrity-body"></tbody>
</table>
</div>
<h3 data-i18n="admin.maintenance.config_heading"></h3>
<p class="detail" data-i18n="admin.maintenance.export_note"></p>
<p>
<button id="config-export" data-i18n="admin.maintenance.export"></button>
<button id="config-import" data-i18n="admin.maintenance.import"></button>
</p>
<label class="visually-hidden" for="config-text" data-i18n="admin.maintenance.import_label"></label>
<textarea id="config-text" rows="8" class="command-line" data-i18n-placeholder="admin.maintenance.import_label"></textarea>
<p id="config-message" class="message" hidden aria-live="polite"></p>
</section>
<section id="diagnostics-section" role="tabpanel">
<h2 data-i18n="admin.diagnostics.heading"></h2>
<p><button id="diagnostics-refresh-button" data-i18n="admin.diagnostics.refresh_button"></button></p>
<ul id="diagnostics-list" class="diagnostics"></ul>
</section>
<section id="manual-section" role="tabpanel">
<h2 data-i18n="admin.manual.heading"></h2>
<p class="detail" data-i18n="admin.manual.note"></p>
<p id="manual-message" class="message" hidden aria-live="polite"></p>
<div class="manual-browser">
<ul id="manual-pages" class="manual-index"></ul>
<iframe id="manual-frame" data-i18n-title="admin.manual.frame_title"></iframe>
</div>
</section>
</main>
